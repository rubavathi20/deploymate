<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeployMate Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>DeployMate</h1>
            <p>Automated Cloud Deployment & Monitoring Platform</p>
        </header>

        <section class="status-card">
            <div>
                <h2>Application Status</h2>
                <span id="status" class="status">Checking...</span>
            </div>
        </section>

        <section class="metrics">

            <div class="card">
                <h3>CPU Usage</h3>
                <p id="cpu">--</p>
            </div>

            <div class="card">
                <h3>Memory Usage</h3>
                <p id="memory">--</p>
            </div>

            <div class="card">
                <h3>Disk Usage</h3>
                <p id="disk">--</p>
            </div>

            <div class="card">
                <h3>Uptime</h3>
                <p id="uptime">--</p>
            </div>

        </section>

        <section class="info">

            <div>
                <strong>Hostname:</strong>
                <span id="hostname">--</span>
            </div>

            <div>
                <strong>Last Updated:</strong>
                <span id="timestamp">--</span>
            </div>

        </section>

        <footer>
            DeployMate Monitoring System
        </footer>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
